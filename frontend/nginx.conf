# Public entry point, reached only through the Cloudflare tunnel.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Internal health, queue status, and manual-refresh routes are not part of
    # the public dashboard. Exact matches take priority over the GET proxy.
    location = /api/health { return 404; }
    location = /api/kev/status { return 404; }
    location = /api/epss/status { return 404; }
    location = /api/nvd/status { return 404; }
    location = /api/ioc/status { return 404; }
    location = /api/kev/refresh { return 404; }
    location = /api/epss/refresh { return 404; }
    location = /api/nvd/refresh { return 404; }

    # Only the narrowed evidence response is public. The original IOC reads
    # expose job scheduling and attempt history useful to an operator.
    location ^~ /api/ioc/public/ {
        limit_except GET { deny all; }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ^~ /api/ioc/ { return 404; }

    # All dashboard reads are stored-data GETs. Background workers ingest data.
    # The current FastAPI refresh routes have no authentication; deny public
    # POST/PUT/PATCH/DELETE here instead of exposing those actions on the demo.
    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite emits hashed assets that can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React handles client-side routes; index.html itself must stay fresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
